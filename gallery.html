  <div id="lightbox" role="dialog" aria-modal="true" aria-labelledby="photo-title" tabindex="-1">
    <button id="close" type="button" aria-label="Close image">&times;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" alt="" />

      <div id="photo-info">
        <div id="photo-title"></div>
        <div id="photo-location"></div>
        <div id="photo-details"></div>
      </div>
    </div>
  </div>

  <script>
    // ========================================
    // GALLERY IMAGE REVEAL
    // ========================================

    window.addEventListener("load", () => {
      const galleryItems = document.querySelectorAll(".gallery-item");

      galleryItems.forEach((item, index) => {
        setTimeout(
          () => {
            item.classList.add("revealed");
          },
          100 + Math.min(index, 7) * 80,
        );
      });
    });

    // ========================================
    // LIGHTBOX
    // ========================================

    const images = document.querySelectorAll(".gallery-item img");
    const galleryItems = document.querySelectorAll(".gallery-item");

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const closeButton = document.getElementById("close");
    let previouslyFocusedElement = null;

    galleryItems.forEach((item) => {
      const image = item.querySelector("img");
      item.tabIndex = 0;
      item.setAttribute("role", "button");
      item.setAttribute("aria-label", image.dataset.title || "Open photo");

      item.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          image.click();
        }
      });
    });

    images.forEach((img) => {
      img.addEventListener("click", function () {
        previouslyFocusedElement = img.closest(".gallery-item");
        lightboxImg.style.opacity = "0";

        const newImage = new Image();

        newImage.onload = function () {
          lightboxImg.src = this.src;
          lightboxImg.style.opacity = "1";

          document.getElementById("photo-title").textContent =
            img.dataset.title;

          document.getElementById("photo-location").textContent =
            img.dataset.location;

          document.getElementById("photo-details").textContent =
            img.dataset.details;
          lightboxImg.alt = img.alt;
        };

        newImage.src = this.src;

        lightbox.style.display = "flex";
        lightbox.focus();
      });
    });

    function closeLightbox() {
      lightbox.style.display = "none";
      previouslyFocusedElement?.focus();
    }

    lightbox.addEventListener("click", function (event) {
      if (event.target === lightbox || event.target === closeButton) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && lightbox.style.display === "flex") {
        closeLightbox();
      }
    });

  </script>
