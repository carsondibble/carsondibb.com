<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Message Confirmation | Carson Dibb Photography</title>
  <meta name="description" content="Your message was sent to Utah photographer Carson Dibb. Thank you for getting in touch." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://www.carsondibb.com/thank-you.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Carson Dibb Photography" />
  <meta property="og:url" content="https://www.carsondibb.com/thank-you.html" />
  <meta property="og:title" content="Message Confirmation | Carson Dibb Photography" />
  <meta property="og:description" content="Your message was sent to Utah photographer Carson Dibb. Thank you for getting in touch." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Message Confirmation | Carson Dibb Photography" />
  <meta name="twitter:description" content="Your message was sent to Utah photographer Carson Dibb. Thank you for getting in touch." />

  <style>
    /* ========================================
         RESET
      ======================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
    }

    /* ========================================
         SIDEBAR
      ======================================== */

    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100vh;
      background: #0d0d0d;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 55px 35px 35px;

      border-right: 1px solid #2a2a2a;
      z-index: 1000;
    }

    /* ========================================
         SIGNATURE
      ======================================== */

    .signature-link {
      display: block;
      width: 195px;
      height: 100%;
      text-decoration: none;
    }

    .signature-container {
      position: relative;
      width: 195px;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-signature {
      position: absolute;
      width: 195px;
      height: auto;
      display: block;

      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .signature-name {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: max-content;

      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 80px;
      font-weight: 1800;
      letter-spacing: 2px;
      text-align: center;

      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .signature-link:hover .sidebar-signature {
      opacity: 0;
    }

    .signature-link:hover .signature-name {
      opacity: 1;
    }

    /* ========================================
         NAVIGATION
      ======================================== */

    #sidebar nav {
      width: 100%;
    }

    #sidebar nav ul {
      list-style: none;

      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    #sidebar nav a {
      color: #fff;

      text-decoration: none;

      font-size: 15px;
      font-weight: 500;

      transition: opacity 0.2s ease;
    }

    #sidebar nav a:hover {
      opacity: 0.55;
    }

    /* ========================================
         MAIN
      ======================================== */

    main {
      position: relative;

      margin-left: 280px;

      min-height: 100vh;

      overflow: hidden;
    }

    /* ========================================
         BACKGROUND VIDEO
      ======================================== */

    .background-video {
      position: absolute;

      top: 0;
      right: 0;
      left: auto;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: right center;

      z-index: 0;
    }

    /* ========================================
         VIDEO OVERLAY
      ======================================== */

    .video-overlay {
      position: absolute;

      inset: 0;

      background: rgba(17, 17, 17, 0.55);

      z-index: 1;
    }

    /* ========================================
         THANK YOU
      ======================================== */

    .thank-you {
      position: relative;

      min-height: 100vh;

      padding: 0 70px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;

      z-index: 2;
    }

    .section-label {
      font-size: 13px;

      letter-spacing: 0.18em;

      color: #aaa;

      text-transform: uppercase;

      margin-bottom: 35px;
    }

    .thank-you h1 {
      font-size: clamp(80px, 14vw, 220px);

      line-height: 0.82;

      letter-spacing: -0.07em;

      font-weight: 700;

      margin-left: -8px;

      max-width: 1100px;
    }

    .thank-you p {
      margin-top: 40px;

      max-width: 550px;

      font-size: 16px;

      line-height: 1.7;

      color: #ccc;
    }

    /* ========================================
         BACK HOME
      ======================================== */

    .back-home {
      display: inline-block;

      margin-top: 40px;

      color: white;

      text-decoration: none;

      font-size: 13px;

      letter-spacing: 0.12em;

      text-transform: uppercase;

      border-bottom: 1px solid #777;

      padding-bottom: 8px;

      transition: opacity 0.2s ease;
    }

    .back-home:hover {
      opacity: 0.5;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
    }

    .signature-name {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: max-content;

      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;

      opacity: 0;
      transition: opacity 0.4s ease;
    }

    main {
      position: relative;
      margin-left: 280px;
      height: 100vh;
      padding: 0 70px;
      overflow: hidden;
    }

    .thank-you {
      position: relative;
      z-index: 2;

      width: 100%;
      height: 100vh;
      min-height: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    /* ========================================
         RESPONSIVE
      ======================================== */

    @media (max-width: 1100px) {
      .thank-you {
        padding: 0 45px;
      }
    }

    @media (max-width: 900px) {
      #sidebar {
        display: none;
      }

      main {
        margin-left: 0;
      }

      .thank-you {
        padding: 0 30px;
      }

      .thank-you h1 {
        font-size: clamp(65px, 18vw, 140px);
      }
    }

    @media (max-width: 600px) {
      .thank-you {
        padding: 0 20px;
      }

      .thank-you h1 {
        font-size: clamp(60px, 19vw, 110px);
      }

      .thank-you p {
        font-size: 14px;

        margin-top: 30px;
      }

      .back-home {
        margin-top: 30px;
      }
    }
  </style>
  <link rel="stylesheet" href="mobile.css" />
</head>

<body>
  <!-- ========================================
         SIDEBAR
    ======================================== -->

  <aside id="sidebar">
    <!-- SIGNATURE -->
    <a href="index.html" class="signature-link">
      <div class="signature-container">
        <img class="sidebar-signature" src="Images/signature.svg" alt="" aria-hidden="true" />

        <span class="signature-name">CARSON <br />DIBB</span>
      </div>
    </a>
    <nav class="sidebar-links" aria-label="Main pages">
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About Me</a>
    </nav>
    <details class="mobile-navigation">
      <summary aria-label="Toggle site navigation">Menu</summary>
      <nav class="mobile-navigation-links" aria-label="Site">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </details>
  </aside>

  <!-- ========================================
         MAIN CONTENT
    ======================================== -->

  <main>
    <!-- BACKGROUND VIDEO -->
    <video class="background-video" muted loop playsinline preload="none" aria-hidden="true">
      <source src="thank-you-video.mp4" type="video/mp4" />
    </video>

    <!-- DARK OVERLAY -->
    <div class="video-overlay"></div>

    <!-- THANK YOU CONTENT -->
    <section class="thank-you">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <ol>
          <li><a href="index.html">Home</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li aria-current="page">Confirmation</li>
        </ol>
      </nav>
      <div class="section-label">CONTACT</div>

      <h1>
        THANK<br />
        YOU.
      </h1>

      <p>
        Your message has been successfully submitted. I’ll get back to you as
        soon as possible.
      </p>

      <a href="index.html" class="back-home"> ← BACK HOME </a>
    </section>
  </main>

  <script>
    const backgroundVideo = document.querySelector(".background-video");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const isCompactViewport = window.matchMedia("(max-width: 900px)").matches;
    const prefersReducedData = navigator.connection && navigator.connection.saveData;

    if (!prefersReducedMotion && !isCompactViewport && !prefersReducedData) {
      backgroundVideo.play().catch((error) => {
        console.error("The background video could not be played:", error);
      });
    }
  </script>
</body>

</html>
